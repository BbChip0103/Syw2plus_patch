name: Patch safety checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: make check PYTHON=python
      - run: python tools/check_setup.py
      # No proprietary EXE in CI: binary-dependent tests explicitly skip.
      # Captured runtime assertions are historical evidence, not fresh Wine execution.
